name: Test Sat.tv Tunisia

on:
  workflow_dispatch:

jobs:
  test-sattv:
    runs-on: ubuntu-latest
    steps:
      - name: Test nouvelle méthode Hannibal
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import html
          import json
          import re
          import time
          import urllib.request
          import urllib.parse
          from zoneinfo import ZoneInfo

          base = "https://www.sat.tv/wp-admin/admin-ajax.php"
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://www.sat.tv/fr/chaines-tv",
              "Origin": "https://www.sat.tv",
              "Cookie": "pll_language=fr",
              "X-Requested-With": "XMLHttpRequest",
          }

          def lire(url, donnees=None):
              corps = urllib.parse.urlencode(donnees).encode() if donnees else None
              requete = urllib.request.Request(url, data=corps, headers=headers)
              with urllib.request.urlopen(requete, timeout=30) as reponse:
                  print("HTTP :", reponse.status)
                  return reponse.read().decode("utf-8", errors="replace")

          jeton = json.loads(lire(base + "?action=get_secure_token"))["data"]["token"]
          jour = datetime.datetime.now(ZoneInfo("Europe/Paris")).date()
          print("Date :", jour)
          page = lire(base, {
              "action": "block_tv_program", "ajax": "true",
              "postId": "29", "lineupId": "53", "sateliteId": "2",
              "dateFiltre": jour.isoformat(), "hoursFiltre": "0",
              "search": "hannibal",
              "userDateTime": str(int(time.time() * 1000)),
              "userTimezone": "Europe/Paris",
              "filterElementCategorie": "", "filterElementGenre": "",
              "event": "false", "lastId": "", "token": jeton,
          })
          titres = re.findall(
              r"""<span class=["']event-data-title["'][^>]*>(.*?)</span>""",
              page, re.S
          )
          print("Programmes trouvés :", len(titres))
          for titre in titres:
              print("-", html.unescape(re.sub("<[^>]+>", "", titre)).strip())
          if not titres:
              raise SystemExit("Aucun programme récupéré.")
          PY
