name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0,6,12,18 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install pypdf beautifulsoup4

      - name: Setup IPTV-ORG EPG
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-source
          cd epg-source
          npm install

      - name: Generate Motorvision+ EPG from Pickx
        continue-on-error: true
        run: |
          cd epg-source
          npm run grab -- --channels=../channels-motorvisionplus-pickx.xml --days=2 --output=../motorvisionplus-pickx.xml

      - name: Generate Nat Geo Wild EPG from Pickx
        run: |
          cd epg-source
          npm run grab -- --channels=../channels-natgeowild-pickx.xml --days=2 --output=../natgeowild-pickx.xml

      - name: Generate custom EPG files
        run: |
          python3 orange_pitchoun.py
          python3 oqee_pitchoun.py
          python3 oqee_ducktv.py
          python3 tunisiatv_watania.py
          python3 samsung_adn.py
          python3 oqee_all.py
          python3 sqool_tv.py
          python3 motorvision_plus.py
          python3 esprit_sorcier.py
          python3 mxgp_tv.py
          python3 f1tv.py
          python3 nessma_canal.py
          python3 aljazeera2.py || echo "Al Jazeera 2 indisponible"

      - name: Verify generated files
        run: |
          test -s pitchoun-kids.xml
          test -s tv-pitchoun.xml
          test -s duck-tv.xml
          test -s watania-officiel.xml
          test -s adn.xml
          test -s guide-free.xml
          test -s sqool-tv.xml
          test -s motorvision-plus.xml
          test -s esprit-sorcier.xml
          test -s mxgp-tv.xml
          test -s f1tv.xml
          test -s nessma.xml
          test -s aljazeera2.xml || echo "EPG Al Jazeera 2 absent"

          ls -lh \
            pitchoun-kids.xml \
            tv-pitchoun.xml \
            duck-tv.xml \
            watania-officiel.xml \
            adn.xml \
            guide-free.xml \
            sqool-tv.xml \
            motorvision-plus.xml \
            esprit-sorcier.xml \
            mxgp-tv.xml \
            f1tv.xml \
            nessma.xml

      - name: Merge generated EPG into guide.xml
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          GUIDE = "guide.xml"

          SOURCES = [
              "pitchoun-kids.xml",
              "tv-pitchoun.xml",
              "duck-tv.xml",
              "watania-officiel.xml",
              "adn.xml",
              "sqool-tv.xml",
              "motorvision-plus.xml",
              "motorvisionplus-pickx.xml",
              "esprit-sorcier.xml",
              "mxgp-tv.xml",
              "f1tv.xml",
              "nessma.xml",
              "aljazeera2.xml",
              "guide-free.xml",
              "natgeowild-pickx.xml",
          ]

          TARGET_IDS = {
              "PitchounKidsMusic.fr",
              "TVPitchoun.fr",
              "DuckTV.fr",
              "Watania1.tn",
              "Watania2.tn",
              "ADN.fr",
              "SQOOLTV.fr",
              "MotorVisionTV.fr",
              "MotorvisionPlus.fr",
              "LEspritSorcierTV.fr",
              "MXGPTV.fr",
              "F1TV1.fr",
              "Nessma.tn",
              "OQEE.1162",
              "OQEE.28",
              "NatGeoWild.fr",
              "AlJazeera2",
          }

          tree = ET.parse(GUIDE)
          root = tree.getroot()

          # Conserver l'ancienne grille Motorvision+ si Pickx est vide.
          try:
              pickx_root = ET.parse("motorvisionplus-pickx.xml").getroot()
              pickx_programmes = [
                  p for p in pickx_root.findall("programme")
                  if p.get("channel") == "MotorvisionPlus.fr"
              ]
          except (OSError, ET.ParseError):
              pickx_programmes = []

          if not pickx_programmes:
              print("Pickx indisponible : ancienne grille Motorvision+ conservée")
              TARGET_IDS.discard("MotorvisionPlus.fr")
              SOURCES.remove("motorvisionplus-pickx.xml")

          for elem in list(root):
              cid = elem.get("id") if elem.tag == "channel" else elem.get("channel")
              if elem.tag in ("channel", "programme") and cid in TARGET_IDS:
                  if cid != "AlJazeera2":
                      root.remove(elem)

          channels = {}
          programmes = []

          for source in SOURCES:
              if source.startswith("aljazeera2"):
                  try:
                      src_root = ET.parse(source).getroot()
                  except (OSError, ET.ParseError):
                      print("Al Jazeera 2 indisponible : fusion ignorée")
                      continue
              else:
                  src_root = ET.parse(source).getroot()

              for elem in src_root:
                  if elem.tag == "channel":
                      cid = elem.get("id")
                      if cid in TARGET_IDS:
                          channels[cid] = elem

                  elif elem.tag == "programme":
                      cid = elem.get("channel")
                      if cid in TARGET_IDS:
                          programmes.append(elem)

          missing = (TARGET_IDS - {"AlJazeera2"}) - set(channels)

          if missing:
              raise SystemExit(
                  "Missing channels in generated EPG: "
                  + ", ".join(sorted(missing))
              )

          existing_channels = [e for e in list(root) if e.tag == "channel"]
          existing_programmes = [e for e in list(root) if e.tag == "programme"]
          others = [e for e in list(root) if e.tag not in ("channel", "programme")]

          for e in list(root):
              root.remove(e)

          # Remplacer Al Jazeera 2 uniquement si une nouvelle grille existe
          if any(p.get("channel") == "AlJazeera2" for p in programmes):
              existing_channels = [
                  c for c in existing_channels
                  if c.get("id") != "AlJazeera2"
              ]
              existing_programmes = [
                  p for p in existing_programmes
                  if p.get("channel") != "AlJazeera2"
              ]

          existing_channel_ids = {e.get("id") for e in existing_channels}

          for channel in existing_channels:
              root.append(channel)

          for cid in sorted(channels):
              if cid not in existing_channel_ids:
                  root.append(channels[cid])

          for e in others:
              root.append(e)

          for programme in existing_programmes:
              root.append(programme)

          for programme in programmes:
              root.append(programme)

          ET.indent(tree, space="  ")
          tree.write(
              GUIDE,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Merged channels:", ", ".join(sorted(channels)))
          print("Merged programmes:", len(programmes))
          PY

      - name: Fill EPG gaps
        run: python3 fill_epg_gaps.py

      - name: Validate guide.xml
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone

          root = ET.parse("guide.xml").getroot()

          ids = [
              "PitchounKidsMusic.fr",
              "TVPitchoun.fr",
              "DuckTV.fr",
              "Watania1.tn",
              "Watania2.tn",
              "ADN.fr",
              "SQOOLTV.fr",
              "MotorVisionTV.fr",
              "MotorvisionPlus.fr",
              "LEspritSorcierTV.fr",
              "MXGPTV.fr",
              "F1TV1.fr",
              "Nessma.tn",
              "OQEE.1162",
              "OQEE.28",
              "NatGeoWild.fr",
          ]

          counts = Counter(
              p.get("channel")
              for p in root.findall("programme")
          )

          print("TOTAL:", len(root.findall("programme")))

          for cid in ids:
              if cid == "MotorvisionPlus.fr" and counts[cid] == 0:
                  print("Motorvision+ absent : validation ignorée")
                  continue
              print(cid, counts[cid])
              if counts[cid] == 0:
                  raise SystemExit(f"No programmes found for {cid}")

          # Vérifie que tous les EPG ne sont pas périmés
          freshness_ids = ids

          now = datetime.now(timezone.utc)

          for cid in freshness_ids:
              if cid == "MotorvisionPlus.fr" and counts[cid] == 0:
                  continue
              items = [
                  p for p in root.findall("programme")
                  if p.get("channel") == cid and p.get("stop")
              ]

              latest = max(
                  datetime.strptime(p.get("stop"), "%Y%m%d%H%M%S %z")
                  for p in items
              )

              print(
                  f"{cid}: {len(items)} programmes, "
                  f"latest stop = {latest.isoformat()}"
              )

              if latest <= now:
                  if cid == "MotorvisionPlus.fr":
                      print("⚠️ Motorvision+ périmé : ancienne grille conservée")
                      continue
                  raise SystemExit(
                      f"Stale EPG for {cid}: "
                      f"last programme ended at {latest.isoformat()}"
                  )
          PY

      - name: Commit updated guide
        run: |
          if git diff --quiet guide.xml guide-free.xml; then
            echo "No change in guide.xml"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guide.xml guide-free.xml
          git commit -m "Mise à jour automatique EPG"
          git pull --rebase --autostash origin main
          git push
